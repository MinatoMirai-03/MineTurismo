def stripJavaComments = { String src ->

	final char SLASH = '/' as char
	final char STAR = '*' as char
	final char NEWLINE = '\n' as char
	final char DQUOTE = '"' as char
	final char SQUOTE = '\'' as char
	final char BACKSLASH = '\\' as char
	def out = new StringBuilder(src.length())
	int i = 0
	int n = src.length()
	while (i < n) {
		char c = src.charAt(i)
		boolean hasNext = i + 1 < n
		char next = hasNext ? src.charAt(i + 1) : c
		if (c == SLASH && hasNext && next == SLASH) {

			while (i < n && src.charAt(i) != NEWLINE) { i++ }
		} else if (c == SLASH && hasNext && next == STAR) {

			i += 2
			while (i < n && !(src.charAt(i) == STAR && i + 1 < n && src.charAt(i + 1) == SLASH)) { i++ }
			i = Math.min(n, i + 2)
			out.append(' ')
		} else if (c == DQUOTE && src.startsWith('"""', i)) {

			int end = src.indexOf('"""', i + 3)
			end = end < 0 ? n : end + 3
			out.append(src, i, end)
			i = end
		} else if (c == DQUOTE || c == SQUOTE) {

			char quote = c
			out.append(c)
			i++
			while (i < n) {
				char d = src.charAt(i)
				out.append(d)
				i++
				if (d == BACKSLASH && i < n) {
					out.append(src.charAt(i))
					i++
				} else if (d == quote || d == NEWLINE) {
					break
				}
			}
		} else {
			out.append(c)
			i++
		}
	}

	def lines = out.toString().replace('\r\n', '\n').split('\n', -1).collect { it.replaceAll(/[ \t]+$/, '') }
	def result = new StringBuilder()
	boolean previousBlank = false
	lines.each { line ->
		boolean blank = line.isEmpty()
		if (!(blank && previousBlank)) {
			result.append(line).append('\n')
		}
		previousBlank = blank
	}
	return result.toString().replaceAll(/^\n+/, '')
}

tasks.register('publicJars') {
	group = 'distribution'
	description = 'Writes dist/public/: every version\'s jar plus a comment-stripped sources jar (for addon authors)'
	dependsOn 'collectJars'

	rootProject.subprojects.each { sub ->
		dependsOn(sub.name.startsWith('1.') ? "${sub.path}:remapSourcesJar" : "${sub.path}:sourcesJar")
	}

	doLast {
		def distDir = file("${rootDir}/dist")
		def publicDir = file("${rootDir}/dist/public")
		publicDir.mkdirs()
		int count = 0
		def sourcesJars = rootProject.subprojects.collect { sub ->
			def libs = new File(sub.projectDir, 'build/libs')
			libs.isDirectory() ? libs.listFiles().findAll { it.isFile() && it.name.contains('+') && it.name.endsWith('-sources.jar') } : []
		}.flatten()
		sourcesJars.sort { it.name }.each { sourcesJar ->
			def mainJar = new File(distDir, sourcesJar.name.replace('-sources.jar', '.jar'))
			if (!mainJar.exists()) {
				throw new GradleException("main jar missing for ${sourcesJar.name}")
			}

			def publicMain = new File(publicDir, mainJar.name).toPath()
			java.nio.file.Files.deleteIfExists(publicMain)
			try {
				java.nio.file.Files.createLink(publicMain, mainJar.toPath())
			} catch (Exception ignored) {
				java.nio.file.Files.copy(mainJar.toPath(), publicMain)
			}
			def target = new File(publicDir, sourcesJar.name)
			new java.util.zip.ZipFile(sourcesJar).withCloseable { zip ->
				new java.util.zip.ZipOutputStream(new FileOutputStream(target)).withCloseable { zos ->

					zip.entries().findAll { !it.name.startsWith('assets/') && !it.name.startsWith('data/') }.each { java.util.zip.ZipEntry entry ->
						def copy = new java.util.zip.ZipEntry(entry.name)
						copy.time = entry.time
						zos.putNextEntry(copy)
						if (!entry.directory) {
							byte[] bytes = zip.getInputStream(entry).bytes
							if (entry.name.endsWith('.java')) {
								bytes = stripJavaComments(new String(bytes, 'UTF-8')).getBytes('UTF-8')
							}
							zos.write(bytes)
						}
						zos.closeEntry()
					}
				}
			}
			count++
		}
		logger.lifecycle("publicJars: wrote ${count} jar + stripped sources jar pairs to ${publicDir}")
	}
}
