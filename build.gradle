jar {
	def projectName = 'mineturismo'
	inputs.property "projectName", projectName

	from(rootProject.file("DANCING_SCRIPT_FONT_LICENSE.txt"))

	from(rootProject.file("RUSSO_ONE_FONT_LICENSE.txt"))
	from(rootProject.file("BUNGEE_FONT_LICENSE.txt"))
	from(rootProject.file("LATO_FONT_LICENSE.txt"))

	from(rootProject.file("LICENSE")) {
		rename { "${it}_$projectName"}
	}

	doLast {
		def jarFile = archiveFile.get().asFile
		def zip = new java.util.zip.ZipFile(jarFile)
		try {
			def readJson = { String name ->
				def entry = zip.getEntry(name)
				entry == null ? null : new groovy.json.JsonSlurper().parse(zip.getInputStream(entry))
			}
			def modJson = readJson("fabric.mod.json")
			def missing = []
			(modJson?.mixins ?: []).collect { it instanceof Map ? it.config : it }.each { String config ->
				def mixinJson = readJson(config)
				if (mixinJson == null) {
					missing << "${config} (config file itself)"
					return
				}
				def pkg = mixinJson.package.replace('.', '/')
				(['mixins', 'client', 'server'].collectMany { mixinJson[it] ?: [] }).each { String name ->
					if (zip.getEntry("${pkg}/${name.replace('.', '/')}.class") == null) {
						missing << "${config}: ${name}"
					}
				}
			}
			if (!missing.isEmpty()) {
				throw new GradleException("Mixins listed in config but not compiled for ${project.minecraft_version}: ${missing}")
			}
		} finally {
			zip.close()
		}
	}
}

