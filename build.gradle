def supportsSplitEnv = mcVersionAtLeast(project.minecraft_version, '1.18')

def downgradeDistJarToJava8 = project.minecraft_version.startsWith('1.') && !mcVersionAtLeast(project.minecraft_version, '1.17')

loom {
	if (supportsSplitEnv) {
		splitEnvironmentSourceSets()
	}

	def localAccessWidener = file("src/main/resources/mineturismo.accesswidener")
	accessWidenerPath = localAccessWidener.exists()
		? localAccessWidener
		: rootProject.file("src/main/resources/mineturismo.accesswidener")

	if (supportsSplitEnv) {
		mods {
			"mineturismo" {
				sourceSet sourceSets.main
				sourceSet sourceSets.client
			}
		}
	}
}

dependencies {

	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	if (project.minecraft_version.startsWith('1.')) {
		mappings loom.officialMojangMappings()
		modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

		if (project.minecraft_version == '1.16') {

			def toolAttributeStubJar = file("${buildDir}/generated/fabricToolAttributeStub/fabric-tool-attribute-api-v1-stub.jar")
			toolAttributeStubJar.parentFile.mkdirs()
			def toolAttributeStagingDir = file("${buildDir}/generated/fabricToolAttributeStub/staging")
			toolAttributeStagingDir.deleteDir()
			toolAttributeStagingDir.mkdirs()
			new File(toolAttributeStagingDir, 'fabric.mod.json').text = '''{
	"schemaVersion": 1,
	"id": "fabric-tool-attribute-api-v1",
	"name": "Fabric Tool Attribute API (v1) [mineturismo stub - real impl incompatible with vanilla 1.16]",
	"version": "1.1.4+5794386e83",
	"environment": "*"
}
'''
			if (toolAttributeStubJar.exists()) {
				toolAttributeStubJar.delete()
			}
			ant.zip(destfile: toolAttributeStubJar, basedir: toolAttributeStagingDir)
			modImplementation("net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}") {
				exclude group: 'net.fabricmc.fabric-api', module: 'fabric-tool-attribute-api-v1'
			}
			modImplementation(files(toolAttributeStubJar))
		} else {
			modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
		}
	} else {
		implementation "net.fabricmc:fabric-loader:${project.loader_version}"
		implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	}
}

static boolean mcVersionAtLeast(String version, String threshold) {
	def toParts = { String v -> v.split('\\.').collect { it.isInteger() ? it.toInteger() : 0 } }
	def vParts = toParts(version)
	def tParts = toParts(threshold)
	int maxLen = Math.max(vParts.size(), tParts.size())
	for (int i = 0; i < maxLen; i++) {
		int vp = i < vParts.size() ? vParts[i] : 0
		int tp = i < tParts.size() ? tParts[i] : 0
		if (vp != tp) return vp > tp
	}
	return true
}

def fabricApiModId = mcVersionAtLeast(project.minecraft_version, '1.19.3') ? 'fabric-api' : 'fabric'

def includePlayerBodyRotationMixin = mcVersionAtLeast(project.minecraft_version, '1.21.2')

processResources {
	def version = project.version
	def minecraftVersion = project.minecraft_version

	def javaVersion = downgradeDistJarToJava8 ? "8" : project.java_version
	inputs.property "version", version
	inputs.property "minecraft_version", minecraftVersion
	inputs.property "java_version", javaVersion
	inputs.property "fabric_api_mod_id", fabricApiModId
	inputs.property "include_player_body_rotation_mixin", includePlayerBodyRotationMixin

	filesMatching("fabric.mod.json") {
		expand "version": version, "minecraft_version": minecraftVersion, "java_version": javaVersion,
				"fabric_api_mod_id": fabricApiModId
	}

	def requireNetworkingV1 = !project.minecraft_version.startsWith('1.') || mcVersionAtLeast(project.minecraft_version, '1.16.2')
	inputs.property "require_networking_v1", requireNetworkingV1
	doLast {
		def modJsonFile = new File(destinationDir, "fabric.mod.json")
		if (requireNetworkingV1 && modJsonFile.exists()) {
			def modJson = new groovy.json.JsonSlurper().parse(modJsonFile)
			modJson.depends["fabric-networking-api-v1"] = "*"
			modJsonFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(modJson))
		}
	}

	doLast {
		def modelsDir = new File(destinationDir, "assets/mineturismo/town_traffic_presets")
		if (!modelsDir.exists()) {
			return
		}
		def presetsDir = new File(destinationDir, "data/mineturismo/town_traffic_presets")
		modelsDir.listFiles({ f -> f.name.endsWith(".json") } as FileFilter)?.each { presetFile ->
			def target = new File(presetsDir, presetFile.name)
			if (!target.exists()) {
				presetsDir.mkdirs()
				target.text = presetFile.text
				logger.lifecycle("[auto-gen] data/mineturismo/town_traffic_presets/${presetFile.name} (copied from assets; no hand-authored server file found)")
			}
		}
	}
}

if (!supportsSplitEnv) {
	processResources {
		doLast {
			def modJsonFile = new File(destinationDir, "fabric.mod.json")
			if (modJsonFile.exists()) {
				def json = new groovy.json.JsonSlurper().parse(modJsonFile)
				json.mixins.removeAll { it instanceof Map && it.config == "mineturismo.client.mixins.json" }

				json.mixins << [config: "mineturismo.legacy_client.mixins.json", environment: "client"]

				if (!mcVersionAtLeast(project.minecraft_version, '1.15')) {
					json.mixins << [config: "mineturismo.legacy114_client.mixins.json", environment: "client"]
				}
				modJsonFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json))
			}
		}
	}

}

def includeMidTexCoordMixin = mcVersionAtLeast(project.minecraft_version, '1.18.2')

def includeItemIconModelMixin = !mcVersionAtLeast(project.minecraft_version, '1.21.4')
tasks.named(supportsSplitEnv ? 'processClientResources' : 'processResources') {
	inputs.property "include_player_body_rotation_mixin", includePlayerBodyRotationMixin
	inputs.property "include_mid_tex_coord_mixin", includeMidTexCoordMixin
	inputs.property "include_item_icon_model_mixin", includeItemIconModelMixin

	doLast {
		def mixinsFile = new File(destinationDir, "mineturismo.client.mixins.json")
		if (mixinsFile.exists() && (!includePlayerBodyRotationMixin || !includeMidTexCoordMixin || !includeItemIconModelMixin)) {
			def json = new groovy.json.JsonSlurper().parse(mixinsFile)
			if (!includePlayerBodyRotationMixin) {
				json.client.remove("PlayerBodyRotationMixin")

				json.client.remove("HumanoidRenderStateMotorcycleMixin")
			}
			if (!includeMidTexCoordMixin) {
				json.client.remove("BufferBuilderMidTexCoordMixin")
			}
			if (!includeItemIconModelMixin) {
				json.client.remove("ItemIconModelMixin")
			}
			mixinsFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json))
		}
	}
}

def needsClientAssetMerge = mcVersionAtLeast(project.minecraft_version, '1.18') && !mcVersionAtLeast(project.minecraft_version, '1.18.2')
if (needsClientAssetMerge) {
	tasks.named('runClient') {
		dependsOn 'generateDLIConfig'
		doFirst {
			def launchCfg = rootProject.file(".gradle/loom-cache/projects/${project.name}/launch.cfg")
			if (!launchCfg.exists()) {
				logger.warn("[1.18.x blit_screen fix] launch.cfg not found at ${launchCfg}, skipping asset merge")
				return
			}
			def commonJarPath = null
			def clientJarPath = null
			launchCfg.eachLine { line ->
				def trimmed = line.trim()
				if (trimmed.startsWith('fabric.gameJarPath=')) {
					commonJarPath = trimmed.substring('fabric.gameJarPath='.length())
				} else if (trimmed.startsWith('fabric.gameJarPath.client=')) {
					clientJarPath = trimmed.substring('fabric.gameJarPath.client='.length())
				}
			}
			if (!commonJarPath || !clientJarPath) {
				logger.warn("[1.18.x blit_screen fix] could not find gameJarPath/gameJarPath.client in launch.cfg, skipping")
				return
			}
			def commonJarFile = new File(commonJarPath)
			def clientJarFile = new File(clientJarPath)
			def alreadyPatched = false
			new java.util.zip.ZipFile(commonJarFile).withCloseable { zf ->
				alreadyPatched = zf.getEntry('assets/minecraft/shaders/core/blit_screen.json') != null
			}
			if (!alreadyPatched) {
				logger.lifecycle("[1.18.x blit_screen fix] merging client-only assets into common jar for ${project.name} (one-time, ~1-2min)...")
				def mergeTempDir = new File(temporaryDir, 'client_asset_merge')
				project.delete(mergeTempDir)
				mergeTempDir.mkdirs()
				project.copy {
					from project.zipTree(clientJarFile)
					include 'assets/**'
					into mergeTempDir
				}
				ant.jar(destfile: commonJarFile.absolutePath, update: true) {
					fileset(dir: mergeTempDir.absolutePath)
				}
				logger.lifecycle("[1.18.x blit_screen fix] merge complete for ${project.name}")
			}
		}
	}

}

